<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alarm Clock - 动画效果</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #faf8f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    gap: 40px;
    padding: 40px;
  }
  h2 { color: #2d2a26; font-size: 18px; font-weight: 600; }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 50px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.05);
    border: 1px solid #f0ece6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* ================================================================
     总周期 8s：
       0% ──55%──> 线条绘制 + 填充渐显（约 4.4s）
      55% ──80%──> 完整画面停留 + 手绘抖动（2s）
      80% ──100%─> 画面淡出重置（约 1.6s）
     ================================================================ */

  /* --- 描边绘制 --- */
  @keyframes strokeDraw {
    0%   { stroke-dashoffset: 8000; }
    55%  { stroke-dashoffset: 0; }
    80%  { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 8000; }
  }

  /* --- 填充渐显 --- */
  @keyframes fillFade {
    0%, 38%  { fill-opacity: 0; }
    55%  { fill-opacity: 1; }
    80%  { fill-opacity: 1; }
    100% { fill-opacity: 0; }
  }

  /* --- 描边粗细抖动（仅在停留期 55%-80%） --- */
  @keyframes strokePulse {
    0%, 55%, 80.1%, 100% { stroke-width: 1.5px; }
    58%  { stroke-width: 2.3px; }
    62%  { stroke-width: 1.2px; }
    66%  { stroke-width: 2.0px; }
    70%  { stroke-width: 1.3px; }
    74%  { stroke-width: 1.9px; }
    78%  { stroke-width: 1.5px; }
    80%  { stroke-width: 1.5px; }
  }

  /* --- 整体手绘抖动（仅在停留期 55%-80%，作用于容器组） --- */
  @keyframes handWiggle {
    0%, 55%, 80.1%, 100% { transform: translate(0, 0) rotate(0deg); }
    56%   { transform: translate(-1.8px, 1.2px) rotate(-0.7deg); }
    57.5% { transform: translate(1.6px, -1.0px) rotate(0.6deg); }
    59%   { transform: translate(-1.2px, -1.6px) rotate(-0.5deg); }
    60.5% { transform: translate(1.4px, 1.4px) rotate(0.4deg); }
    62%   { transform: translate(-0.8px, 0.6px) rotate(-0.3deg); }
    63.5% { transform: translate(0.7px, -0.7px) rotate(0.2deg); }
    65%   { transform: translate(-1.6px, 0.2px) rotate(-0.5deg); }
    66.5% { transform: translate(1.5px, -0.3px) rotate(0.5deg); }
    68%   { transform: translate(-0.2px, 1.2px) rotate(-0.2deg); }
    69.5% { transform: translate(-1.3px, -0.9px) rotate(-0.4deg); }
    71%   { transform: translate(1.1px, 1.0px) rotate(0.3deg); }
    72.5% { transform: translate(0.3px, -1.1px) rotate(-0.2deg); }
    74%   { transform: translate(-1.5px, 0.5px) rotate(-0.5deg); }
    75.5% { transform: translate(1.4px, -0.6px) rotate(0.4deg); }
    77%   { transform: translate(-0.5px, 1.0px) rotate(-0.3deg); }
    78.5% { transform: translate(0.6px, -0.8px) rotate(0.2deg); }
    80%   { transform: translate(0, 0) rotate(0deg); }
  }

  /* ========== 应用 ========== */
  .anim-draw {
    color: #2d2a26;
  }

  /* 所有形状元素：描边绘制 + 填充渐显 + 描边抖动（三组动画同时跑） */
  .anim-draw path,
  .anim-draw circle,
  .anim-draw rect,
  .anim-draw line,
  .anim-draw ellipse,
  .anim-draw polyline,
  .anim-draw polygon {
    stroke-dasharray: 8000;
    stroke-dashoffset: 8000;
    stroke: currentColor;
    stroke-width: 1.5px;
    animation:
      strokeDraw  8s ease-in-out infinite,
      fillFade    8s ease-in-out infinite,
      strokePulse 8s ease-in-out infinite;
  }

  /* SVG 内部容器组：手绘抖动 */
  .anim-wiggle-g {
    animation: handWiggle 8s ease-in-out infinite;
    transform-origin: center center;
  }

  /* --- 底部时间轴指示器 --- */
  .timeline {
    display: flex;
    gap: 0;
    width: 335px;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    background: #f0ece6;
    margin-top: 8px;
  }
  .timeline .draw-phase  { flex: 55; background: #b8b8b8; }
  .timeline .hold-phase  { flex: 25; background: #f4a460; position: relative; }
  .timeline .fade-phase  { flex: 20; background: #e0d8cc; }
  .timeline-label {
    display: flex;
    justify-content: space-between;
    width: 335px;
    font-size: 11px;
    color: #9a9590;
  }
</style>
</head>
